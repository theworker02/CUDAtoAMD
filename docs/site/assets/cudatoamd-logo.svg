  <defs>
    <linearGradient id="signal" x1="40" y1="40" x2="280" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#78a9ff"/><stop offset=".5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
    <linearGradient id="word" x1="350" y1="55" x2="1060" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#bec8e5"/></linearGradient>
