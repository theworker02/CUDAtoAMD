[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-amd-compat"
version = "1.4.0"
description = "Compatibility inventory and analyzer for CUDA-oriented workloads on AMD ROCm/HIP"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
compat = "compat.cli:main"

[project.optional-dependencies]
native = ["cffi>=1.16"]
inference = ["cffi>=1.16", "numpy>=1.24"]

[tool.setuptools]
packages = ["compat", "compatibility"]

[tool.setuptools.package-data]
compat = ["native.cdef"]
compatibility = ["cuda_api.json"]
